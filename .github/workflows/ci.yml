name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  postman-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start API in the background
        run: |
          dotnet run --project src/Documents.Api --urls "http://localhost:5000" &
          echo "Waiting for API to become available..."
          for i in {1..20}; do
            if curl -sf http://localhost:5000/swagger/index.html > /dev/null; then
              echo "API is up."
              exit 0
            fi
            sleep 2
          done
          echo "API did not start in time."
          exit 1

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman collection
        run: |
          newman run postman/DocumentsAPI.postman_collection.json \
            --env-var "baseUrl=http://localhost:5000"
